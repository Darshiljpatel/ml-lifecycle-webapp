<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction - Home</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #243b53;
        }

        p {
            color: #627d98;
            line-height: 1.6;
        }

        button {
            background: #2878d0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #195ca5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to FWI Prediction</h1>

        <p>
            Predict the Forest Weather Index using your
            environmental measurements and a trained
            machine learning model.
        </p>

        <!-- ADDED: Connects the welcome page to the prediction page -->
        <form action="{{ url_for('predict_datapoint') }}" method="GET">
            <button type="submit">Start Prediction</button>
        </form>
    </div>
</body>
</html>
